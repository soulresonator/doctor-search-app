name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m venv .venv
        .venv/bin/pip install -r src/backend/requirements.txt
        .venv/bin/pip install pytest pytest-django pytest-env
    - name: Run Pytest
      run: |
        .venv/bin/pytest tests/backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install and Build
      working-directory: ./src/frontend
      run: |
        npm install
        npm run build
