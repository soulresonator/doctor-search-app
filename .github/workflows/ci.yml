name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nhat
          POSTGRES_PASSWORD: password
          POSTGRES_DB: doctorapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m venv .venv
        .venv/bin/pip install -r src/backend/requirements.txt
        .venv/bin/pip install pytest pytest-django pytest-env psycopg2-binary
    - name: Run Pytest
      env:
        DB_USER: nhat
        DB_PASSWORD: password
        DB_NAME: doctorapp_test
        DB_HOST: localhost
        DB_PORT: 5432
      run: |
        .venv/bin/pytest tests/backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install and Build
      working-directory: ./src/frontend
      run: |
        npm install
        npm run build
